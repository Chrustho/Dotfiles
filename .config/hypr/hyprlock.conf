# ~/.config/hypr/hyprlock.conf
# Tema: Gruvbox Cyber Terminal (Boxed Clock)

general {
    hide_cursor = true
    disable_loading_bar = true
}

background {
    monitor =
    path = /home/christho/Immagini/wallhaven-exj2ek_2880x1800.png
    
    blur_passes = 3
    blur_size = 6
    noise = 0.03
    brightness = 0.35
}

# ==========================================
#  DISPLAY OROLOGIO (Il Box Rigoroso)
# ==========================================

# Il Box dell'Orologio (Ora con più respiro)
shape {
    monitor =
    size = 740, 320               # <-- Dimensioni aumentate per dare molto più padding al testo
    color = rgb(29, 32, 33)       # base-bg: #1d2021 (Sfondo scuro assoluto)
    border_size = 4               # Bordo 4px coerente con il tuo Rofi/Waybar
    border_color = rgb(231, 138, 78) # orange: #e78a4e
    rounding = 0                  # Nessun arrotondamento
    
    position = 0, 190
    halign = center
    valign = center
}

# Il Testo dell'Orologio
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M:%S")</b>"
    color = rgb(221, 199, 161)    # fg-light: #ddc7a1
    font_size = 100                # Dimensione mantenuta, ma ora galleggerà in uno spazio più ampio
    font_family = IosevkaTerm Nerd Font Bold
    
    position = 0, 210
    halign = center
    valign = center
}

# Sub-Header Data e Tempo UNIX (Sotto il Box)
label {
    monitor =
    text = cmd[update:1000] echo "SYS.DATE: $(date +'%Y.%m.%d') // UNIX_TIME: $(date +'%s')"
    color = rgb(169, 182, 101)    # green: #a9b665
    font_size = 20
    font_family = IosevkaTerm Nerd Font Mono
    
    position = 0, 90
    halign = center
    valign = center
}

# ==========================================
#  INPUT PASSWORD E STATO
# ==========================================

# Indicatore Utente (Sopra l'input)
label {
    monitor =
    text = >_ TARGET_USER: $USER
    color = rgb(125, 174, 163)    # blue: #7daea3
    font_size = 20
    font_family = IosevkaTerm Nerd Font Bold
    
    position = 0, -60
    halign = center
    valign = center
}

# Barra della Password (Coordinata al Box dell'Orologio)
input-field {
    monitor =
    size = 450, 70
    outline_thickness = 4         # Bordo 4px
    rounding = 0                  # Spigoli vivi
    
    outer_color = rgb(231, 138, 78) # orange: #e78a4e
    inner_color = rgb(29, 32, 33)   # base-bg: #1d2021
    font_color = rgb(221, 199, 161) # fg-light: #ddc7a1
    
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    
    fade_on_empty = false
    placeholder_text = <span font_family="IosevkaTerm Nerd Font Mono" foreground="##7c6f64">AWAITING_INPUT...</span>
    
    # Messaggio in rosso Gruvbox in caso di errore
    fail_text = <span font_family="IosevkaTerm Nerd Font Bold">AUTH_FAILED // ATTEMPT: $ATTEMPTS</span>
    fail_color = rgb(234, 105, 98)  # red: #ea6962
    
    position = 0, -130
    halign = center
    valign = center
}

# ==========================================
#  DIAGNOSTICA DI SISTEMA (In basso al centro)
# ==========================================
label {
    monitor =
    text = cmd[update:60000] echo "BATTERY_LVL: $(cat /sys/class/power_supply/BAT0/capacity)% | SYS_UPTIME: $(uptime -p | sed 's/up //')"
    color = rgb(216, 166, 87)     # yellow: #d8a657
    font_size = 26
    font_family = IosevkaTerm Nerd Font Mono
    
    position = 0, 40
    halign = center
    valign = bottom
}
