# ~/.config/hypr/hyprlock.conf
# === TEMA: ULTRABRUTALIST 90s OS (Win 3.1 / 95) ===
# Teal desktop, finestra di dialogo grigia con drop-shadow netto, title bar navy.
# Backup dell'originale in hyprlock.conf.bak
# Font opzionale per il massimo feeling: "W95FA" (https://github.com/An-GG/w95fa) in ~/.local/share/fonts

general {
    hide_cursor = false
    disable_loading_bar = true
}

# --- Desktop teal classico (non troppo bianco) ---
background {
    monitor =
    color = rgb(7, 84, 84)
}

# --- Drop-shadow netto della finestra (brutalismo) ---
shape {
    monitor =
    size = 772, 452
    color = rgb(0, 0, 0)
    border_size = 0
    rounding = 0
    position = 7, -7
    halign = center
    valign = center
}

# --- Bevel chiaro (bordo alto-sinistra) ---
shape {
    monitor =
    size = 764, 444
    color = rgb(223, 223, 223)
    border_size = 0
    rounding = 0
    position = -2, 2
    halign = center
    valign = center
}

# --- Pannello principale grigio ---
shape {
    monitor =
    size = 760, 440
    color = rgb(140, 140, 140)
    border_size = 3
    border_color = rgb(10, 10, 10)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# --- Title bar navy ---
shape {
    monitor =
    size = 736, 50
    color = rgb(0, 0, 130)
    border_size = 0
    rounding = 0
    position = 0, 183
    halign = center
    valign = center
}

label {
    monitor =
    text = ■ SYSTEM.LOCKED
    color = rgb(235, 235, 235)
    font_size = 20
    font_family = IosevkaTerm Nerd Font Bold
    position = 0, 183
    halign = center
    valign = center
}

# Pulsante "X" finto della title bar
shape {
    monitor =
    size = 34, 34
    color = rgb(140, 140, 140)
    border_size = 2
    border_color = rgb(10, 10, 10)
    rounding = 0
    position = 338, 183
    halign = center
    valign = center
}
label {
    monitor =
    text = X
    color = rgb(10, 10, 10)
    font_size = 18
    font_family = IosevkaTerm Nerd Font Bold
    position = 338, 183
    halign = center
    valign = center
}

# --- Orologio (grande, nero su grigio) ---
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(15, 15, 15)
    font_size = 96
    font_family = IosevkaTerm Nerd Font Bold
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +'%a %d %b %Y'
    color = rgb(30, 30, 30)
    font_size = 18
    font_family = IosevkaTerm Nerd Font
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = LOGGED USER: $USER
    color = rgb(30, 30, 30)
    font_size = 16
    font_family = IosevkaTerm Nerd Font Bold
    position = 0, -38
    halign = center
    valign = center
}

# --- Campo password (text field 90s) ---
input-field {
    monitor =
    size = 440, 56
    outline_thickness = 3
    rounding = 0
    outer_color = rgb(10, 10, 10)
    inner_color = rgb(205, 205, 205)
    font_color = rgb(15, 15, 15)
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##555555">ENTER PASSWORD...</span>
    fail_text = <span foreground="##000000">ACCESS DENIED — RETRY ($ATTEMPTS)</span>
    check_color = rgb(0, 0, 130)
    fail_color = rgb(150, 0, 0)
    position = 0, -110
    halign = center
    valign = center
}

# --- Pulsanti finti OK / CANCEL ---
shape {
    monitor =
    size = 120, 40
    color = rgb(150, 150, 150)
    border_size = 2
    border_color = rgb(10, 10, 10)
    rounding = 0
    position = -75, -180
    halign = center
    valign = center
}
label {
    monitor =
    text = OK
    color = rgb(10, 10, 10)
    font_size = 16
    font_family = IosevkaTerm Nerd Font Bold
    position = -75, -180
    halign = center
    valign = center
}
shape {
    monitor =
    size = 120, 40
    color = rgb(150, 150, 150)
    border_size = 2
    border_color = rgb(10, 10, 10)
    rounding = 0
    position = 75, -180
    halign = center
    valign = center
}
label {
    monitor =
    text = CANCEL
    color = rgb(10, 10, 10)
    font_size = 16
    font_family = IosevkaTerm Nerd Font Bold
    position = 75, -180
    halign = center
    valign = center
}
