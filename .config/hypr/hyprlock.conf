# Hyprlock: stile MINIMAL (orologio gigante, niente decorazioni)

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(15, 15, 18)
}

# orologio gigante
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(236, 236, 240)
    font_size = 130
    font_family = IosevkaTerm Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# data
label {
    monitor =
    text = cmd[update:1000] date +"%A %d %B"
    color = rgb(120, 120, 132)
    font_size = 18
    font_family = IosevkaTerm Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    rounding = 26
    outer_color = rgb(60, 60, 70)
    inner_color = rgb(28, 28, 34)
    font_color = rgb(236, 236, 240)
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##7a7a86">•••</span>
    fail_text = <span foreground="##ff6b6b">$ATTEMPTS</span>
    check_color = rgb(154, 167, 232)
    fail_color = rgb(200, 80, 80)
    position = 0, -120
    halign = center
    valign = center
}
