# Hyprlock: stile TOKYONIGHT (pannello layered, orologio neon)

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(26, 27, 38)
}

# pannello di fondo
shape {
    monitor =
    size = 520, 320
    color = rgb(36, 40, 59)
    border_size = 1
    border_color = rgb(122, 162, 247)
    rounding = 20
    position = 0, 40
    halign = center
    valign = center
}

# orologio
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(122, 162, 247)
    font_size = 96
    font_family = IosevkaTerm Nerd Font Bold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgb(122, 162, 247)
    position = 0, 92
    halign = center
    valign = center
}

# data
label {
    monitor =
    text = cmd[update:1000] date +"%A %d %B %Y"
    color = rgb(192, 202, 245)
    font_size = 18
    font_family = IosevkaTerm Nerd Font
    position = 0, 12
    halign = center
    valign = center
}

# utente
label {
    monitor =
    text = 󰌾  $USER
    color = rgb(187, 154, 247)
    font_size = 16
    font_family = IosevkaTerm Nerd Font Bold
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 54
    outline_thickness = 2
    rounding = 12
    outer_color = rgb(122, 162, 247)
    inner_color = rgb(26, 27, 38)
    font_color = rgb(192, 202, 245)
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">Inserisci password</span>
    fail_text = <span foreground="##f7768e">Accesso negato ($ATTEMPTS)</span>
    check_color = rgb(158, 206, 106)
    fail_color = rgb(247, 118, 142)
    position = 0, -130
    halign = center
    valign = center
}
