# Hyprlock: stile NORD (card fredda, pulito)

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(46, 52, 64)
}

# card
shape {
    monitor =
    size = 460, 320
    color = rgb(59, 66, 82)
    border_size = 1
    border_color = rgb(76, 86, 106)
    rounding = 18
    position = 0, 20
    halign = center
    valign = center
}

# orologio
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(136, 192, 208)
    font_size = 92
    font_family = IosevkaTerm Nerd Font Bold
    position = 0, 82
    halign = center
    valign = center
}

# data
label {
    monitor =
    text = cmd[update:1000] date +"%A %d %B"
    color = rgb(216, 222, 233)
    font_size = 17
    font_family = IosevkaTerm Nerd Font
    position = 0, 12
    halign = center
    valign = center
}

# utente
label {
    monitor =
    text = ❄  $USER
    color = rgb(129, 161, 193)
    font_size = 16
    font_family = IosevkaTerm Nerd Font Bold
    position = 0, -28
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 14
    outer_color = rgb(136, 192, 208)
    inner_color = rgb(46, 52, 64)
    font_color = rgb(216, 222, 233)
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##81a1c1">Password</span>
    fail_text = <span foreground="##bf616a">Errato ($ATTEMPTS)</span>
    check_color = rgb(163, 190, 140)
    fail_color = rgb(191, 97, 106)
    position = 0, -110
    halign = center
    valign = center
}
