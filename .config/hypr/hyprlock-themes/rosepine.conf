# Hyprlock: stile ROSE PINE (foto sfocata + card translucida)
# Sfondo: usa una wallpaper con blur. Se il file non esiste, hyprlock
# mostra nero e la card resta comunque funzionante.

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/christho/Immagini/Sfondi/pawel-czerwinski-tMbQpdguDVQ-unsplash.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.15
}

# card translucida
shape {
    monitor =
    size = 460, 300
    color = rgba(191724b0)
    border_size = 1
    border_color = rgba(ebbcba55)
    rounding = 22
    position = 0, 10
    halign = center
    valign = center
}

# orologio
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(224, 222, 244)
    font_size = 92
    font_family = IosevkaTerm Nerd Font Bold
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000088)
    position = 0, 78
    halign = center
    valign = center
}

# data
label {
    monitor =
    text = cmd[update:1000] date +"%A %d %B"
    color = rgb(235, 188, 186)
    font_size = 17
    font_family = IosevkaTerm Nerd Font
    position = 0, 8
    halign = center
    valign = center
}

# utente
label {
    monitor =
    text =   $USER
    color = rgb(196, 167, 231)
    font_size = 16
    font_family = IosevkaTerm Nerd Font Bold
    position = 0, -28
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 26
    outer_color = rgb(235, 111, 146)
    inner_color = rgba(1f1d2eb3)
    font_color = rgb(224, 222, 244)
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##908caa">Sblocca</span>
    fail_text = <span foreground="##eb6f92">Errato ($ATTEMPTS)</span>
    check_color = rgb(156, 207, 216)
    fail_color = rgb(235, 111, 146)
    position = 0, -110
    halign = center
    valign = center
}
