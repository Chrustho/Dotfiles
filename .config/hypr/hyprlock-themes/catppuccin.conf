# Hyprlock: stile CATPPUCCIN MOCHA (card centrale + avatar)

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(30, 30, 46)
}

# card
shape {
    monitor =
    size = 420, 520
    color = rgb(24, 24, 37)
    border_size = 2
    border_color = rgb(203, 166, 247)
    rounding = 24
    position = 0, 0
    halign = center
    valign = center
}

# cerchio avatar
shape {
    monitor =
    size = 110, 110
    color = rgb(203, 166, 247)
    border_size = 0
    rounding = -1
    position = 0, 150
    halign = center
    valign = center
}
label {
    monitor =
    text =
    color = rgb(30, 30, 46)
    font_size = 52
    font_family = IosevkaTerm Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# saluto
label {
    monitor =
    text = Ciao, $USER
    color = rgb(205, 214, 244)
    font_size = 20
    font_family = IosevkaTerm Nerd Font Bold
    position = 0, 55
    halign = center
    valign = center
}

# orologio
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(205, 214, 244)
    font_size = 56
    font_family = IosevkaTerm Nerd Font Bold
    position = 0, -5
    halign = center
    valign = center
}

# data
label {
    monitor =
    text = cmd[update:1000] date +"%a %d %b"
    color = rgb(166, 173, 200)
    font_size = 15
    font_family = IosevkaTerm Nerd Font
    position = 0, -50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 25
    outer_color = rgb(203, 166, 247)
    inner_color = rgb(49, 50, 68)
    font_color = rgb(205, 214, 244)
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password</span>
    fail_text = <span foreground="##f38ba8">Errato ($ATTEMPTS)</span>
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    position = 0, -150
    halign = center
    valign = center
}
