# Configurazione Alacritty

[general]
import = [
    "~/.config/alacritty/themes/themes/kanagawa_dragon.toml"
]

[font]
size = 16

[font.bold]
family = "IosevkaTerm Nerd FontMono"
style = "Heavy"

[font.bold_italic]
family = "IosevkaTerm Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "IosevkaTerm Nerd Font Mono"
style = "SemiBold Italic"

[font.normal]
family = "IosevkaTerm Nerd Font"
style = "SemiBold"

[font.offset]
x = 0
y = 2

[font.glyph_offset]
x = 0
y = 1

[env]
TERM = "xterm-256color"
